<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image d’arrière-plan CSS d'éco-conçue</title>

<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .hero-banner{
width: 100%;
height: 50vh;
background-color: #3a7d6c ; 
/*couleur de fond similaire à l'image*/
background-image: url('./img/hero-banner-small.webp');
background-image: url('https://placehold.co/800x400/webp?text=panda+sympa+small');
background-size: cover;
background-position: center;
    }

/*Utiliser une image plus grande uniquement sur les grands écran */

@media (min-width: 1200px) {
.hero-banner {
background-image: url('./img/hero-banner-larger.webp');
background-image: url('https://placehold.co/1080x400/webp?text=panda+sympa');
}
}


</style>



</head>







<body>
    
<div class="hero-banner" role="img" aria-label="Description de l'image de bannière">

    <!-- Contenu de la bannière -->

</div>


</body>
</html>
